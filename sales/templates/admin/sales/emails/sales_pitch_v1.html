<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>Comunicación Oficial</title>

    <style type="text/css">
        /* RESET TÁCTICO PARA CLIENTES DE CORREO */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        table { border-collapse: collapse !important; }
        body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; }
        
        /* APPLE MAIL LINK FIX */
        a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }

        /* VARIABLES DE ENTORNO VISUAL */
        .wrapper { background-color: #F4F7F9; width: 100%; table-layout: fixed; padding-bottom: 60px; }
        .main-content { background-color: #ffffff; width: 100%; max-width: 600px; margin: 0 auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); }
        .inner-content { padding: 45px 50px; color: #2C3E50; line-height: 1.65; font-size: 16px; text-align: left; }
        
        /* TIPOGRAFÍA B2B */
        h1, h2, h3 { color: #111827; margin-top: 0; font-weight: 600; }
        p { margin: 0 0 20px 0; }
        a { color: #2563EB; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }

        .footer { padding: 30px 50px; background-color: #FAFAFA; border-top: 1px solid #EEEEEE; font-size: 13px; color: #6B7280; text-align: center; line-height: 1.5; }
        .footer-brand { font-weight: bold; color: #374151; letter-spacing: 0.5px; }

        /* DARK MODE - OMEGA PROTOCOL */
        @media (prefers-color-scheme: dark) {
            .wrapper { background-color: #111827 !important; }
            .main-content { background-color: #1F2937 !important; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3) !important; }
            .inner-content { color: #D1D5DB !important; }
            h1, h2, h3 { color: #F9FAFB !important; }
            a { color: #60A5FA !important; }
            .footer { background-color: #111827 !important; border-top: 1px solid #374151 !important; color: #9CA3AF !important; }
            .footer-brand { color: #E5E7EB !important; }
        }

        /* RESPONSIVE FLUIDITY */
        @media screen and (max-width: 600px) {
            .inner-content { padding: 30px 25px !important; }
            .footer { padding: 25px !important; }
        }
    </style>
</head>
<body style="background-color: #F4F7F9; margin: 0; padding: 0;">

    <div style="display: none; max-height: 0px; overflow: hidden; mso-hide: all; font-size: 0px; color: transparent; line-height: 0px;">
        Información reservada para el equipo directivo de {{ institution_name }} &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
    </div>

    <center class="wrapper">
        <div class="webkit">
            <table role="presentation" class="main-content" align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-top: 40px; max-width: 600px;">
                <tr>
                    <td class="inner-content">
                        {{ email_body|safe }}
                    </td>
                </tr>
                <tr>
                    <td class="footer">
                        Destinatario: <strong>{{ institution_name }}</strong><br>
                        Este mensaje ha sido transmitido de manera segura.<br><br>
                        <span class="footer-brand">OMNI-HYDRA PROTOCOL</span> &copy; 2026
                    </td>
                </tr>
            </table>

            </div>
    </center>

    <img src="{{ base_url }}/sales/omni-pixel/{{ tracking_uuid }}/" width="1" height="1" style="display:block; border:none; outline:none; text-decoration:none; visibility:hidden; mso-hide:all;" alt="" />

</body>
</html>
