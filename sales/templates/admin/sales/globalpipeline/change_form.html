{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block object-tools-items %}
    {{ block.super }}
    
    {% if object_id %}
    <style>
        /* Hardware Accelerated Shimmer Effect */
        @keyframes shimmer-radar {
            0% { transform: translateX(-100%) skewX(-15deg); }
            100% { transform: translateX(200%) skewX(-15deg); }
        }
        .animate-shimmer-radar {
            animation: shimmer-radar 2s infinite;
        }
    </style>
    
    <li class="ml-2">
        <a href="{% url 'admin:sales_globalpipeline_omniradar' object_id %}" 
           target="_blank"
           title="Enlazar con el Centro de Mando Táctico"
           class="group relative overflow-hidden inline-flex items-center justify-center gap-3 px-6 py-2.5 bg-gradient-to-r from-[#3b0764] via-[#4c1d95] to-[#1e3a8a] hover:from-[#4c1d95] hover:via-[#5b21b6] hover:to-[#1d4ed8] text-white text-[11px] font-black uppercase tracking-[0.2em] rounded-xl shadow-[0_0_20px_rgba(139,92,246,0.4)] hover:shadow-[0_0_30px_rgba(139,92,246,0.7)] border border-purple-400/50 transition-all duration-300 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 z-50">
            
            <span class="absolute inset-0 w-[150%] h-full bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:animate-shimmer-radar pointer-events-none"></span>
            
            <div class="relative flex items-center justify-center">
                <span class="absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-40 animate-ping"></span>
                <span class="material-symbols-outlined text-[18px] relative z-10 text-cyan-300 group-hover:text-cyan-100 group-hover:rotate-90 transition-all duration-500 drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]">radar</span>
            </div>
            
            <span class="relative z-10 text-transparent bg-clip-text bg-gradient-to-r from-white to-purple-200 drop-shadow-sm flex items-center gap-2">
                Desplegar Radar <span class="text-[9px] bg-purple-500/30 border border-purple-400/50 px-1.5 py-0.5 rounded text-white tracking-widest">LIVE</span>
            </span>
        </a>
    </li>
    {% endif %}
{% endblock %}
